# Конфигурация голосового чата
# ==============================================

# Настройки радиосвязи
radio:
  # Кулдаун между радиосообщениями (в секундах)
  cooldown: 3
  
  # Громкость звуковых эффектов (0.0 - 1.0)
  sound_volume: 0.5
  
  # Разрешить радиосообщения во время ожидания в лобби
  enable_in_lobby: true
  
  # Отображать индикатор на компасе при отметке цели
  show_compass_indicator: true
  
  # Время отображения отметки (в секундах)
  mark_duration: 15

# Настройки голосового чата
voice:
  # Максимальное расстояние слышимости обычного голоса (в блоках)
  proximity_distance: 30
  
  # Автоматически присоединять игроков к каналу их команды
  auto_join_team_channel: true
  
  # Разрешить переключение каналов во время игры
  allow_channel_switch: true
  
  # Оповещать всех о смене канала игроком
  broadcast_channel_change: false
  
  # Настройки каналов
  channels:
    team:
      # Ограничить канал только участниками команды
      team_only: true
      # Радиус действия (0 = неограниченный)
      radius: 0
      # Дополнительные эффекты для голоса в канале (none, radio, megaphone)
      effect: radio
    
    tactical:
      # Кто может использовать тактический канал
      allowed_classes: [ASSAULT, SNIPER, ENGINEER]
      # Радиус действия (0 = неограниченный)
      radius: 0
      # Дополнительные эффекты для голоса в канале
      effect: radio
    
    all:
      # Радиус действия (0 = неограниченный для admin, иначе стандартный радиус)
      radius: 0
      # Дополнительные эффекты для голоса в канале
      effect: none 